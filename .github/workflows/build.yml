name: Build DimLife IRC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dimlife-irc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v5

      - name: Проверка наличия секретов подписи
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Найдены все секреты подписи."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Не все секреты подписи доступны. Причина будет указана без раскрытия значений."
            [[ -n "$KEYSTORE_BASE64" ]] || echo "::warning::Не задан секрет KEYSTORE_BASE64 / SIGNING_KEYSTORE_BASE64."
            [[ -n "$KEYSTORE_PASSWORD" ]] || echo "::warning::Не задан секрет KEYSTORE_PASSWORD / SIGNING_KEYSTORE_PASSWORD."
            [[ -n "$KEY_PASSWORD" ]] || echo "::warning::Не задан секрет KEY_PASSWORD / SIGNING_KEY_PASSWORD."
            [[ -n "$KEY_ALIAS" ]] || echo "::warning::Не задан секрет KEY_ALIAS / SIGNING_KEY_ALIAS."
          fi

      - name: Настройка Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Подготовка Gradle
        run: chmod +x ./gradlew

      - name: Сборка устанавливаемого APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Подготовка имени APK
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/*.apk "release-files/DimLife-IRC-v${VERSION_NAME}.apk"
        env:
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Декодирование ключа подписи
        if: ${{ steps.signing.outputs.ready == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"

      - name: Сборка подписанного релизного APK
        if: ${{ steps.signing.outputs.ready == 'true' }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --no-build-cache
          cp app/build/outputs/apk/release/*.apk "release-files/DimLife-IRC-v${VERSION_NAME}.apk"
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}

      - name: Удаление временного ключа
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Загрузка APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DimLife-IRC-v${{ format('0.1.{0}', github.run_number) }}
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Обновление CHANGELOG.md
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          PREVIOUS_TAG=$(git tag --sort=-version:refname | head -n 1 || true)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMMITS=$(git log "$PREVIOUS_TAG..HEAD" --pretty=format:'- %s (%h)' --no-merges)
          else
            COMMITS=$(git log -10 --pretty=format:'- %s (%h)' --no-merges)
          fi
          if [[ -z "$COMMITS" ]]; then
            COMMITS='- Обновление проекта.'
          fi
          if grep -q "^## ${VERSION_NAME}$" CHANGELOG.md; then
            echo "Запись ${VERSION_NAME} уже есть в CHANGELOG.md."
            exit 0
          fi
          printf '# DimLife IRC — Changelog\n\n## %s — %s\n\n%s\n\n' "$VERSION_NAME" "$(date -u +%F)" "$COMMITS" > /tmp/changelog-entry.md
          cat CHANGELOG.md >> /tmp/changelog-entry.md
          cat /tmp/changelog-entry.md > CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${VERSION_NAME} [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Публикация релиза DimLife IRC
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ format('0.1.{0}', github.run_number) }}
          name: DimLife IRC — версия ${{ format('0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release-files/*.apk
          body: |
            ## DimLife IRC

            **Android-клиент IRC-сети DimLife**

            Подключайтесь к IRC-серверу **irc.dimlife.ru** и общайтесь в сети DimLife прямо с телефона.

            ### Установка
            1. Скачайте APK-файл ниже.
            2. Откройте его на Android и подтвердите установку.
            3. Если Android запросит разрешение, разрешите установку приложений из используемого источника.

            ### Подпись приложения
            ${{ steps.signing.outputs.ready == 'true' && 'APK подписан постоянным ключом релизной подписи.' || 'APK подписан тестовым ключом Android. Для установки будущих обновлений может потребоваться удалить предыдущую версию; перед удалением сохраните важные настройки.' }}
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
