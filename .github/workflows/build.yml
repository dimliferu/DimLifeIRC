name: Build DimLife IRC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dimlife-irc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build installable debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Decode release signing key
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Build unsigned release APK when signing is not configured
        if: ${{ env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_PASSWORD == '' || env.KEY_ALIAS == '' }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-build-cache
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dimlife-irc-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed GitHub Release
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: DimLife IRC v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Publish installable debug APK when signing is unavailable
        if: ${{ github.event_name != 'pull_request' && (env.KEYSTORE_BASE64 == '' || env.KEYSTORE_PASSWORD == '' || env.KEY_PASSWORD == '' || env.KEY_ALIAS == '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: DimLife IRC v0.1.${{ github.run_number }} (debug signed)
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          body: |
            This APK is signed with the Android debug key because release signing secrets were unavailable to GitHub Actions.
            For future updates, install a release signed with the same key as this build.
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
