name: Build DimLife IRC

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dimlife-irc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v5

      - name: Настройка Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Настройка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Подготовка Gradle
        run: chmod +x ./gradlew

      - name: Сборка устанавливаемого APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Подготовка имени APK
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/debug/*.apk "release-files/DimLife-IRC-v${VERSION_NAME}.apk"
        env:
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}

      - name: Декодирование ключа подписи
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"

      - name: Сборка подписанного релизного APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --no-build-cache
          cp app/build/outputs/apk/release/*.apk "release-files/DimLife-IRC-v${VERSION_NAME}.apk"
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('0.1.{0}', github.run_number) }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Удаление временного ключа
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Загрузка APK в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: DimLife-IRC-v${{ format('0.1.{0}', github.run_number) }}
          path: release-files/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Публикация релиза DimLife IRC
        if: ${{ github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ format('0.1.{0}', github.run_number) }}
          name: DimLife IRC — версия ${{ format('0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release-files/*.apk
          body: |
            ## DimLife IRC

            **Android-клиент IRC-сети DimLife**

            Подключайтесь к IRC-серверу **irc.dimlife.ru** и общайтесь в сети DimLife прямо с телефона.

            ### Установка
            1. Скачайте файл **DimLife-IRC-v${{ format('0.1.{0}', github.run_number) }}.apk** ниже.
            2. Откройте APK на Android и подтвердите установку.
            3. Если Android запросит разрешение, разрешите установку приложений из используемого источника.

            ### Важно
            Эта сборка подписана тестовым ключом Android, поскольку постоянный ключ релизной подписи пока не настроен в GitHub Actions. Для установки будущих обновлений может потребоваться удалить предыдущую версию приложения. Перед удалением сохраните важные настройки, если они нужны.
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
